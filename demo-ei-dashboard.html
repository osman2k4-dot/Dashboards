  DATA.cats.forEach(function(cat){h+='<th class="num">'+cat+'</th>'});
  h+='</tr></thead><tbody>';
  keys.forEach(function(k){var u=DATA.units[k];h+='<tr><td><b>'+k.split('|')[1]+'</b></td>';
   DATA.cats.forEach(function(cat){var g=u[cat];
    if(!g){h+='<td class="num" style="color:#cbd5e1">·</td>';return}
    var p=g[0]>0?100*g[1]/g[0]:0;
    h+='<td class="num" title="'+fmt(g[1])+' / '+fmt(g[0])+'"><span style="color:'+pcol(p)+';font-weight:700">'+fmt(p)+'%</span><br><span class="s">'+fmt(g[1])+'/'+fmt(g[0])+'</span></td>'});
   h+='</tr>'});
  h+='</tbody></table></div></div>'});
 h+='<div class="s">Cell = completed / total (register quantities) with completion %. Categories group the register\'s activity types.</div>';
 $('view').innerHTML=h}
function unitPct(u){var t=0,c2=0;DATA.cats.forEach(function(cat){var g=u[cat];if(g){t+=g[0];c2+=g[1]}});return t>0?100*c2/t:0}
function chipRow(u){var out='';[['Cable laying','Cable'],['Termination/Glanding','Term'],['Panels/JB','Panels'],['Lighting','Light'],['Earthing/LPS','Earth']].forEach(function(m){
 var g=u[m[0]];if(!g||g[0]<=0)return;var p=100*g[1]/g[0];
 out+='<span style="display:inline-block;margin:1px 3px 1px 0;padding:1px 7px;border-radius:99px;font-size:10.5px;font-weight:700;background:#f8fafc;border:1px solid #e2e8f0;color:'+pcol(p)+'">'+m[1]+' '+fmt(p)+'%</span>'});
 return out}
function layout(){var h='';
 if(typeof IMG!=='undefined'&&IMG&&DATA.zones['215']){
  h+='<div class="panel"><h3>Green Field — E&amp;I progress on plot plan</h3><div style="position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden"><img src="'+IMG+'" style="width:100%;display:block">';
  Object.keys(DATA.zones).forEach(function(z){var u=DATA.units['GF|'+z];if(!u)return;var p=unitPct(u);
   h+='<div style="position:absolute;left:'+DATA.zones[z].x+'%;top:'+DATA.zones[z].y+'%;transform:translate(-50%,-50%);background:rgba(255,255,255,.94);border:3px solid '+pcol(p)+';border-radius:12px;padding:9px 13px;min-width:190px;box-shadow:0 2px 10px rgba(0,0,0,.3)">'+
    '<div style="font-weight:800;font-size:14px">Unit '+z+' <span style="color:'+pcol(p)+'">'+fmt(p)+'%</span></div>'+chipRow(u)+'</div>'});
  h+='</div><div class="s" style="margin-top:6px">Overall % = completed/total across all E&amp;I register quantities of the unit; chips show key categories.</div></div>'}
 var bfKeys=Object.keys(DATA.units).filter(function(k){return k.indexOf('BF|')===0}).sort();
 if(bfKeys.length&&typeof BFIMG!=='undefined'){
  h+='<div class="panel"><h3>Brown Field — E&amp;I progress by unit plot plan</h3><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px">';
  bfKeys.forEach(function(k){var u=DATA.units[k],lbl=k.split('|')[1],p=unitPct(u);
   var img=BFIMG[DATA.bfImgMap[(lbl.match(/\d{3}/)||[''])[0]]];
   h+='<div style="background:#fff;border:3px solid '+pcol(p)+';border-radius:12px;overflow:hidden">'+(img?'<img src="'+img+'" style="width:100%;height:150px;object-fit:cover;display:block">':'')+
    '<div style="padding:8px 12px"><b>Unit '+lbl+'</b> <span style="float:right;font-weight:800;color:'+pcol(p)+'">'+fmt(p)+'%</span><div>'+chipRow(u)+'</div></div></div>'});
  h+='</div></div>'}
 h+='<div class="s">Layout images are the project plot plans; E&amp;I data per unit from the newest DPR-EIT activity register. Site Team C\'s mails carry cable schedules / JB installation / lighting working sheets (no drawing-type layouts) — those are captured and can add cable-level depth later.</div>';
 $('view').innerHTML=h}
var TABS=[['KPI — Management',kpi],['Commodities',overview],['Daily plan vs actual',daily],['Cable areas',cabareas],['Area / unit detail',areas],['Layout',layout],['Drawings',drawings]];
