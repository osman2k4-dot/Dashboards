<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Site Progress</title>
<style>
:root{--bg:#f6f8fa;--card:#fff;--line:#e2e8f0;--text:#1e293b;--muted:#64748b;--accent:#1a56db;--accent-dark:#12399b;--soft:#eef3fe;
--good:#0a7f0a;--good-bg:#ecfdf5;--warn-bg:#fff7ec;--warn:#8a5a12;--crit:#c02f2f;--crit-bg:#fef2f2}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.4}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 90px}
header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
header h1{font-size:18px}header .sub{font-size:12.5px;color:var(--muted)}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.step{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px}
.step b{width:20px;height:20px;border-radius:50%;background:var(--soft);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-size:11px}
.step.done b{background:var(--accent);color:#fff}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:4px}
input,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;font-family:inherit;color:var(--text);background:#fff}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:22px;padding:9px 14px;font-size:14px;font-weight:600;color:var(--text);cursor:pointer;font-family:inherit}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip:disabled{opacity:.45;cursor:not-allowed}
.list{margin-top:8px;max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid var(--line);padding:11px 12px;font-family:inherit;font-size:14.5px;color:var(--text);cursor:pointer}
.item:last-child{border-bottom:0}
.item:hover{background:#f8fafc}
.item.on{background:var(--soft)}
.item .meta{margin-left:auto;display:flex;gap:6px;flex:none}
.tag{font-size:11px;font-weight:700;border-radius:20px;padding:2px 8px;white-space:nowrap}
.tag.ok{background:var(--good-bg);color:var(--good)}
.tag.hold{background:var(--warn-bg);color:var(--warn)}
.tag.w{background:var(--soft);color:var(--accent-dark)}
.empty{padding:12px;color:var(--muted);font-size:13.5px}
.sel{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:10px;padding:10px 12px;font-weight:700}
.sel button{margin-left:auto;background:none;border:0;color:var(--accent);font-weight:600;font-family:inherit;cursor:pointer;font-size:13.5px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;text-align:left;font-family:inherit;cursor:pointer;color:var(--text)}
.act b{display:block;font-size:15px}.act span{font-size:12px;color:var(--muted)}
.act.on{border-color:var(--accent);background:var(--soft);box-shadow:inset 0 0 0 1px var(--accent)}
.act:disabled{opacity:.45;cursor:not-allowed}
.sub-f{margin-top:12px;display:grid;gap:10px}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar .in{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center}
.sum{flex:1;font-size:12.5px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.go{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:13px 22px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;flex:none}
.go:disabled{background:#a8bbe6;cursor:not-allowed}
.msg{border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.msg.ok{background:var(--good-bg);color:var(--good);border:1px solid #a7f3d0}
.msg.err{background:var(--crit-bg);color:var(--crit);border:1px solid #fecaca}
.rec{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.rec:last-child{border-bottom:0}
.rec .w{color:var(--muted);font-size:12px}
.rec.void{opacity:.5;text-decoration:line-through}
.rec button{margin-left:auto;flex:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font-size:12.5px;font-weight:600;color:var(--crit);cursor:pointer;font-family:inherit}
.loading{text-align:center;color:var(--muted);padding:40px 0}
.demo{background:var(--warn-bg);color:var(--warn);border:1px solid #f3ddb8;border-radius:10px;padding:8px 12px;font-size:12.5px;margin-bottom:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">SP</div>
    <div><h1>Site Progress</h1><div class="sub">Piping erection &amp; field welds</div></div>
  </header>
  <div id="demo" class="demo" hidden>Preview mode with sample data. Nothing is saved. Run server.py to go live.</div>
  <div id="msg" class="msg" hidden role="status"></div>
  <div id="app"><div class="loading">Loading spools…</div></div>

  <div class="card" id="recentCard" hidden>
    <div class="step">Recent entries</div>
    <div id="recent"></div>
  </div>
</div>
<div class="bar"><div class="in"><div class="sum" id="sum">Choose an area to start</div><button class="go" id="go" disabled>Save</button></div></div>

<script>
(function(){
'use strict';
var D=null,st={area:'',spool:'',activity:'',joint:'',welder:'',hold:'',search:'',wsearch:''},busy=false;
var HOLDS=['Material hold: valves not received','Awaiting spool delivery from fab shop','Isometric revision pending','Support steel not released','Line held for client comments','Access / scaffolding not ready'];
var ACTS=[['Field weld','Joint welded by a welder'],['Erected','Spool set in final position'],['Hold','Work stopped: give reason'],['Clear hold','Constraint removed']];
function $(id){return document.getElementById(id)}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k)||'';localStorage.setItem(k,v)}catch(e){return ''}}

// ---- server bridge (Apps Script) or local preview ----
// Served by server.py -> real API. Opened as a local file -> preview with sample data.
var live=location.protocol!=='file:';
var ROUTE={getMasterData:['GET','/api/master'],submitEntry:['POST','/api/entry'],undoEntry:['POST','/api/undo']};
function call(fn,arg){
  if(!live){try{return Promise.resolve(MOCK[fn](arg))}catch(e){return Promise.reject(e)}}
  var r=ROUTE[fn],body=fn==='undoEntry'?{id:arg,reporter:state0.reporter}:arg;
  return fetch(r[1],{method:r[0],headers:{'Content-Type':'application/json','X-Site-Pin':ls('sp.pin'),'X-Reporter':encodeURIComponent(state0.reporter)},body:r[0]==='POST'?JSON.stringify(body):undefined})
    .then(function(res){return res.json().catch(function(){return {error:'Server error ('+res.status+')'}}).then(function(j){
      if(j&&j.pin){var p=prompt('Enter the site PIN');if(p){ls('sp.pin',p.trim());return call(fn,arg)}}
      if(!res.ok||j.error)throw new Error(j.error||('Server error ('+res.status+')'));return j})},
      function(){throw new Error('No connection to the progress server. Check Wi-Fi / network and try again; your selections are kept.')});
}

var state0={date:today(),reporter:ls('sp.reporter')};
function fail(e){showMsg('err',(e&&e.message)||String(e))}
function showMsg(kind,txt){var m=$('msg');m.className='msg '+kind;m.textContent=txt;m.hidden=false;window.scrollTo({top:0,behavior:'smooth'})}

call('getMasterData').then(function(d){D=d;render();renderRecent()}).catch(function(e){$('app').textContent='';fail(e)});

function spoolSt(id){return (D.status&&D.status[id])||{erected:'',hold:'',welded:[]}}
function card(n,title,done){var c=el('div','card'),s=el('div','step'+(done?' done':''));s.appendChild(el('b',null,String(n)));s.appendChild(document.createTextNode(title));c.appendChild(s);return c}

function render(){
  var app=$('app');app.textContent='';
  // 1. who & when
  var c1=card(1,'Who & when',state0.reporter&&state0.date),g=el('div','row2');
  var a=el('div');a.appendChild(el('label','f','Your name'));var nm=el('input');nm.value=state0.reporter;nm.placeholder=D.user||'Name';nm.autocomplete='name';
  nm.addEventListener('change',function(){state0.reporter=nm.value.trim();ls('sp.reporter',state0.reporter);sum()});a.appendChild(nm);
  var b=el('div');b.appendChild(el('label','f','Work date'));var dt=el('input');dt.type='date';dt.max=today();dt.value=state0.date;
  dt.addEventListener('change',function(){state0.date=dt.value;sum()});b.appendChild(dt);
  g.appendChild(a);g.appendChild(b);c1.appendChild(g);app.appendChild(c1);

  // 2. area
  var c2=card(2,'Area',!!st.area),ch=el('div','chips');
  D.areas.forEach(function(ar){var x=el('button','chip'+(st.area===ar?' on':''),ar);x.type='button';
    x.addEventListener('click',function(){st.area=ar;st.spool='';st.joint='';st.search='';render()});ch.appendChild(x)});
  c2.appendChild(ch);app.appendChild(c2);
  if(!st.area){sum();return}

  // 3. spool
  var c3=card(3,'Spool number',!!st.spool);
  if(st.spool){
    var sl=el('div','sel');sl.appendChild(el('span',null,st.spool));var ss=spoolSt(st.spool);
    if(ss.erected)sl.appendChild(el('span','tag ok','Erected '+ss.erected));if(ss.hold)sl.appendChild(el('span','tag hold','Hold'));
    var chg=el('button',null,'Change');chg.type='button';chg.addEventListener('click',function(){st.spool='';st.joint='';st.activity='';render()});sl.appendChild(chg);c3.appendChild(sl);
    if(ss.hold)c3.appendChild(el('div','hint','On hold: '+ss.hold));
  }else{
    var q=el('input');q.type='search';q.placeholder='Type part of the spool or line number';q.value=st.search;q.setAttribute('aria-label','Search spools');
    var list=el('div','list');
    var draw=function(){list.textContent='';var t=st.search.toUpperCase().replace(/\s+/g,'');
      var m=D.spools.filter(function(s){return s.area===st.area&&(!t||s.id.toUpperCase().replace(/\s+/g,'').indexOf(t)>=0)});
      if(!m.length){list.appendChild(el('div','empty','No spool matches in this area.'));return}
      m.slice(0,60).forEach(function(s){var it=el('button','item');it.type='button';it.appendChild(el('span',null,s.id));var mt=el('span','meta'),x=spoolSt(s.id),jt=(D.joints[s.id]||[]).length;
        if(jt)mt.appendChild(el('span','tag w',x.welded.length+'/'+jt+' FW'));else if(x.welded.length)mt.appendChild(el('span','tag w',x.welded.length+' FW'));
        if(x.erected)mt.appendChild(el('span','tag ok','Erected'));else if(x.hold)mt.appendChild(el('span','tag hold','Hold'));
        it.appendChild(mt);it.addEventListener('click',function(){st.spool=s.id;st.joint='';st.activity='';render()});list.appendChild(it)});
      if(m.length>60)list.appendChild(el('div','empty','Showing 60 of '+m.length+'. Type more of the number to narrow down.'))};
    q.addEventListener('input',function(){st.search=q.value;draw()});
    c3.appendChild(q);c3.appendChild(list);draw();
  }
  app.appendChild(c3);
  if(!st.spool){sum();return}

  // 4. activity + details
  var x=spoolSt(st.spool),c4=card(4,'What was done',!!st.activity),acts=el('div','acts');
  ACTS.forEach(function(r){var bt=el('button','act'+(st.activity===r[0]?' on':''));bt.type='button';bt.appendChild(el('b',null,r[0]));bt.appendChild(el('span',null,r[1]));
    if((r[0]==='Erected'&&x.erected)||(r[0]==='Clear hold'&&!x.hold)||(r[0]==='Hold'&&x.erected))bt.disabled=true;
    bt.addEventListener('click',function(){st.activity=r[0];render()});acts.appendChild(bt)});
  c4.appendChild(acts);
  var sub=el('div','sub-f');
  if(st.activity==='Field weld'){
    var js=D.joints[st.spool]||[],jd=el('div');jd.appendChild(el('label','f','Field joint (FW) no.'));
    if(js.length){var jc=el('div','chips');js.forEach(function(j){var done=x.welded.indexOf(j)>=0,b=el('button','chip'+(st.joint===j?' on':''),j+(done?' ✓':''));b.type='button';b.disabled=done;
        b.addEventListener('click',function(){st.joint=j;render()});jc.appendChild(b)});jd.appendChild(jc);
      if(js.every(function(j){return x.welded.indexOf(j)>=0}))jd.appendChild(el('div','hint','All field joints on this spool are already welded.'));}
    else{var ji=el('input');ji.placeholder='e.g. FW-01';ji.value=st.joint;ji.addEventListener('input',function(){st.joint=ji.value.trim().toUpperCase();sum()});jd.appendChild(ji);
      if(x.welded.length)jd.appendChild(el('div','hint','Already welded: '+x.welded.join(', ')));}
    sub.appendChild(jd);
    var wd=el('div');wd.appendChild(el('label','f','Welder'));var ws=el('select');ws.appendChild(new Option('Select welder…',''));
    D.welders.forEach(function(w){ws.appendChild(new Option(w.name+(w.stamp?' ('+w.stamp+')':''),w.name))});ws.value=st.welder;
    ws.addEventListener('change',function(){st.welder=ws.value;ls('sp.welder',ws.value);sum()});wd.appendChild(ws);sub.appendChild(wd);
  }
  if(st.activity==='Hold'){var hd=el('div');hd.appendChild(el('label','f','Hold reason'));var hs=el('select');hs.appendChild(new Option('Select reason…',''));
    HOLDS.concat(['Other…']).forEach(function(h){hs.appendChild(new Option(h,h))});
    var ho=el('input');ho.placeholder='Describe the hold';ho.hidden=true;
    if(st.hold&&HOLDS.indexOf(st.hold)<0){hs.value='Other…';ho.hidden=false;ho.value=st.hold}else hs.value=st.hold;
    hs.addEventListener('change',function(){if(hs.value==='Other…'){ho.hidden=false;st.hold=ho.value.trim();ho.focus()}else{ho.hidden=true;st.hold=hs.value}sum()});
    ho.addEventListener('input',function(){st.hold=ho.value.trim();sum()});hd.appendChild(hs);hd.appendChild(ho);sub.appendChild(hd)}
  if(sub.childNodes.length)c4.appendChild(sub);
  app.appendChild(c4);sum();
}

function ready(){
  if(!state0.reporter&&!D.user)return 'Enter your name';
  if(!state0.date)return 'Pick the work date';
  if(!st.area)return 'Choose an area';if(!st.spool)return 'Choose a spool';if(!st.activity)return 'Choose what was done';
  if(st.activity==='Field weld'&&!st.joint)return 'Choose the field joint';
  if(st.activity==='Field weld'&&!st.welder)return 'Choose the welder';
  if(st.activity==='Hold'&&!st.hold)return 'Give the hold reason';
  return '';
}
function sum(){var r=ready(),g=$('go');g.disabled=!!r||busy;
  $('sum').textContent=r||(st.spool+' · '+st.activity+(st.activity==='Field weld'?' '+st.joint+' · '+st.welder:''))}

$('go').addEventListener('click',function(){
  if(ready()||busy)return;busy=true;$('go').textContent='Saving…';sum();
  var e={area:st.area,spool:st.spool,activity:st.activity,joint:st.joint,welder:st.welder,hold:st.hold,workDate:state0.date,reporter:state0.reporter};
  call('submitEntry',e).then(function(r){
    D.status=r.status;D.recent=r.recent;
    showMsg('ok','Saved: '+e.spool+' · '+e.activity+(e.activity==='Field weld'?' '+e.joint+' by '+e.welder:'')+'. The 4D model picks it up on its next refresh.');
    var keepWelder=st.welder;st.activity='';st.joint='';st.hold='';st.welder=keepWelder;render();renderRecent();
  }).catch(fail).then(function(){busy=false;$('go').textContent='Save';sum()});
});

function renderRecent(){
  var box=$('recent');box.textContent='';var r=D.recent||[];$('recentCard').hidden=!r.length;
  r.forEach(function(x){var row=el('div','rec'+(x.void?' void':'')),t=el('div');
    t.appendChild(el('div',null,x.spool+' · '+x.activity+(x.joint?' '+x.joint:'')+(x.welder?' · '+x.welder:'')+(x.hold?' · '+x.hold:'')));
    t.appendChild(el('div','w',x.when+' · '+x.by+(x.void?' · undone':'')));row.appendChild(t);
    if(x.canUndo){var u=el('button',null,'Undo');u.type='button';u.addEventListener('click',function(){
      if(!confirm('Undo '+x.spool+' · '+x.activity+'?'))return;
      call('undoEntry',x.id).then(function(r){D.status=r.status;D.recent=r.recent;showMsg('ok','Entry undone.');render();renderRecent()}).catch(fail)});row.appendChild(u)}
    box.appendChild(row)});
}

// ---- local preview data (used only when opened outside Google Apps Script) ----
var MOCK=(function(){
  if(live)return null;$('demo').hidden=false;
  var areas=['A1 Inlet & separation','A2 Gas treating','A3 Compression','A4 Utilities & flare KO'],spools=[],joints={},status={},recent=[],n=0;
  areas.forEach(function(a,ai){for(var i=1;i<=14;i++){var id=['6"-P-215','8"-CW-215','4"-HC-259','10"-PG-259'][ai]+String(i).padStart(3,'0')+'-SP0'+(1+i%3);
    spools.push({id:id,area:a,line:id.replace(/-SP\d+$/,'')});joints[id]=['FW-01','FW-02','FW-03'].slice(0,1+i%3);
    if(i%4===0)status[id]={erected:'2026-11-0'+(1+i%8),hold:'',welded:joints[id].slice()};else if(i%5===0)status[id]={erected:'',hold:'Material hold: valves not received',welded:[]}}});
  var welders=[{name:'R. Kumar',stamp:'W-104'},{name:'A. Hassan',stamp:'W-117'},{name:'J. Santos',stamp:'W-122'},{name:'M. Ali',stamp:'W-131'}];
  function stOf(id){return status[id]=status[id]||{erected:'',hold:'',welded:[]}}
  function now(){var d=new Date();return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})+' '+d.toTimeString().slice(0,5)}
  return {
    getMasterData:function(){return {areas:areas,spools:spools,joints:joints,welders:welders,status:status,recent:recent,user:''}},
    submitEntry:function(e){var s=stOf(e.spool);
      if(e.activity==='Field weld'){if(s.welded.indexOf(e.joint)>=0)throw new Error('Joint '+e.joint+' is already recorded as welded.');s.welded.push(e.joint)}
      if(e.activity==='Erected')s.erected=e.workDate;if(e.activity==='Hold')s.hold=e.hold;if(e.activity==='Clear hold')s.hold='';
      recent.unshift({id:String(++n),spool:e.spool,activity:e.activity,joint:e.activity==='Field weld'?e.joint:'',welder:e.activity==='Field weld'?e.welder:'',hold:e.activity==='Hold'?e.hold:'',by:e.reporter,when:now(),canUndo:true,void:false});
      return {status:status,recent:recent}},
    undoEntry:function(id){var r=recent.filter(function(x){return x.id===id})[0];if(r){r.void=true;r.canUndo=false;var s=stOf(r.spool);
      if(r.activity==='Field weld')s.welded=s.welded.filter(function(j){return j!==r.joint});if(r.activity==='Erected')s.erected='';if(r.activity==='Hold')s.hold=''}
      return {status:status,recent:recent}}
  };
})();
})();
</script>
</body>
</html>
