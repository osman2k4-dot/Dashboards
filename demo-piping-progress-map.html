<style>
:root{--bg:#f6f8fa;--card:#fff;--line:#e2e8f0;--text:#1e293b;--muted:#64748b;--accent:#0aa2c0;
--red:#dc2626;--amber:#d97706;--blue:#0aa2c0;--green:#16a34a;--gray:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
.wrap{max-width:1440px;margin:0 auto;padding:16px 20px 50px}
header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
h1{font-size:19px;font-weight:700}h1 .sub{color:var(--muted);font-weight:500}
.chip{background:#eef3fe;color:#12399b;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600}
.chip.date{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}
.spacer{margin-left:auto}
.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer}
.btn:hover{border-color:#94a3b8}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.kpi .v{font-size:19px;font-weight:700}.kpi .v small{font-size:12px;color:var(--muted);font-weight:600}
.kpi .l{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
.kpi .bar{height:6px;background:#eef2f7;border-radius:4px;margin-top:6px;overflow:hidden}
.kpi .bar i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.tabs{display:flex;gap:4px;margin:10px 0 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{border:none;background:none;padding:9px 16px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;background:var(--card);padding:7px 12px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--accent);color:#fff}
select{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12.5px;font-weight:600;color:var(--text);background:var(--card)}
.legend{display:flex;gap:12px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.split{display:grid;grid-template-columns:1fr 320px;gap:12px;align-items:start}
.mapcard{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.viewport{position:relative;overflow:auto;max-height:80vh;background:#fff}
.stage{position:relative}
.stage img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.mk{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;cursor:grab;z-index:5}
.mk.drag{cursor:grabbing;z-index:20}
.mk .bub{border-radius:50%;border:3px solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;color:#fff;box-shadow:0 1px 5px rgba(15,23,42,.4);text-shadow:0 1px 2px rgba(0,0,0,.4);line-height:1.05}
.mk .bub small{font-size:8.5px;font-weight:600;opacity:.95}
.mk .lbl{margin-top:2px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:10.5px;font-weight:700;white-space:nowrap;color:#0f172a;text-align:center}
.mk .lbl .val{color:#334155;font-weight:600}
.mk.sel .bub{outline:3px solid #f59e0b;outline-offset:1px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;position:sticky;top:10px;max-height:84vh;overflow:auto}
.panel h3{font-size:15px;margin-bottom:2px}.panel .u{color:var(--muted);font-size:12px;margin-bottom:8px}
.sect{font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.5px;background:#f8fafc;border:1px solid var(--line);border-radius:6px;padding:3px 8px;margin:10px 0 4px;display:inline-block}
.row{display:flex;justify-content:space-between;font-size:12.5px;padding:3.5px 0;border-bottom:1px dashed #eef2f7;gap:8px}
.row b{font-variant-numeric:tabular-nums;text-align:right}
.blbl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);font-weight:600;margin-top:6px}
.bar{height:7px;background:#eef2f7;border-radius:4px;margin:3px 0 2px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.note{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.5}
.info{background:#f0fbfd;border:1px solid #bee9f4;border-radius:8px;padding:8px 10px;font-size:11.5px;color:#0d3e63;line-height:1.5;margin-top:8px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{padding:7px 9px;font-size:12.5px;border-bottom:1px solid #eef2f7;text-align:right;white-space:nowrap}
th{background:#f8fafc;color:#475569;position:sticky;top:0}
td:first-child,th:first-child,td:nth-child(2),th:nth-child(2){text-align:left}
tr:hover td{background:#f8fafc}tr.tot td{font-weight:700;background:#f1f5f9}
.jgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;margin-bottom:12px}
.jcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.jcard h4{font-size:13px;margin-bottom:2px}.jcard .u{font-size:11px;color:var(--muted);margin-bottom:8px}
.jcard .big{font-size:18px;font-weight:700}.jcard .big small{font-size:12px;color:var(--muted);font-weight:600}
.wchart{display:flex;gap:6px;align-items:flex-end;height:88px;margin-top:10px}
.wk{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.wk .cols{display:flex;gap:2px;align-items:flex-end;height:64px;width:100%;justify-content:center}
.wk .p,.wk .a{width:12px;border-radius:3px 3px 0 0}
.wk .p{background:#c6d6f8}.wk .a{background:var(--green)}
.wk .d{font-size:9.5px;color:var(--muted);font-weight:600;white-space:nowrap}
@media print{.toolbar,.tabs,.btn{display:none}.viewport{max-height:none;overflow:visible}}
</style>
</head>
