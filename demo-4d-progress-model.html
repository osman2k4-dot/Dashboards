<style>

.chips{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}

.speed{margin-top:5px;width:100%;border:1px solid var(--line);background:#fff;border-radius:3px;padding:3px;font-size:12px;cursor:pointer}
