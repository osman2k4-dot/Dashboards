var $=function(i){return document.getElementById(i)};
function fmt(n,d){return (n===null||n===undefined||isNaN(n))?'–':n.toLocaleString('en-US',{minimumFractionDigits:d||0,maximumFractionDigits:d||0})}
function dlab(iso){var m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return (+iso.slice(8,10))+'-'+m[+iso.slice(5,7)-1]}
var C={er:'#16a34a',dis:'#d97706',mod:'#0aa2c0'};
$('rng').textContent=dlab(DATA.start)+' → '+dlab(DATA.asOf)+' 2026';
$('upd').textContent='updated '+DATA.generated;
function sum(f,k){return DATA.days.reduce(function(a,r){return a+(r[f][k]||0)},0)}
function mandays(f){return DATA.days.reduce(function(a,r){return a+(r[f].men||0)},0)}
function unitAgg(f){var out={};DATA.days.forEach(function(r){var us=r[f].units||{};Object.keys(us).forEach(function(k){
 var o=out[k]||(out[k]={er:0,dis:0,mod:0,md:0,mdEr:0,act:'',lastAct:null,lastVol:null});var u=us[k];
 o.er+=u.er;o.dis+=u.dis;o.mod+=u.mod;o.md+=u.men;o.mdEr+=(u.mdEr||0);
 if(u.men||u.er||u.dis||u.mod){o.lastAct=r.d}
 if(u.er||u.dis||u.mod){o.lastVol=r.d}
 if(u.act)o.act=u.act;});});return out}
function status(o){var recent=DATA.days.slice(-3).map(function(r){return r.d});
 if(o.lastAct&&recent.indexOf(o.lastAct)>=0)return['IN PROGRESS','#16a34a'];
 if(o.er+o.dis+o.mod>0)return['PROGRESSED','#d97706'];return['NO WORK','#94a3b8']}
/* ---------- charts ---------- */
function chart(f,title){var W=1150,H=250,P=42,days=DATA.days,n=days.length,bw=Math.min(26,(W-2*P)/n*0.62);
 var mx=1;days.forEach(function(r){mx=Math.max(mx,r[f].er+r[f].dis+r[f].mod)});
 var mmx=1;days.forEach(function(r){mmx=Math.max(mmx,r[f].men)});
 var s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">';
 for(var g=0;g<=4;g++){var y=P/2+(H-P*1.5)*g/4;s+='<line x1="'+P+'" y1="'+y+'" x2="'+(W-8)+'" y2="'+y+'" stroke="#f1f5f9"/>'+
  '<text x="'+(P-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="10" fill="#94a3b8">'+fmt(mx*(4-g)/4)+'</text>'}
 days.forEach(function(r,i){var x=P+(W-2*P)*(i+0.5)/n,base=H-P;
  var hEr=(H-P*1.5)*r[f].er/mx,hMod=(H-P*1.5)*r[f].mod/mx,hDis=(H-P*1.5)*r[f].dis/mx,y=base;
  y-=hEr;s+='<rect x="'+(x-bw/2)+'" y="'+y+'" width="'+bw+'" height="'+hEr+'" fill="'+C.er+'" rx="2"><title>'+dlab(r.d)+' erection '+fmt(r[f].er,1)+' M3</title></rect>';
  y-=hMod;s+='<rect x="'+(x-bw/2)+'" y="'+y+'" width="'+bw+'" height="'+hMod+'" fill="'+C.mod+'" rx="2"><title>modification '+fmt(r[f].mod,1)+'</title></rect>';
  y-=hDis;s+='<rect x="'+(x-bw/2)+'" y="'+y+'" width="'+bw+'" height="'+hDis+'" fill="'+C.dis+'" rx="2"><title>dismantle '+fmt(r[f].dis,1)+'</title></rect>';
  if(i%Math.ceil(n/16)===0)s+='<text x="'+x+'" y="'+(H-P+16)+'" text-anchor="middle" font-size="10" fill="#64748b">'+dlab(r.d)+'</text>'});
 var pts=days.map(function(r,i){var x=P+(W-2*P)*(i+0.5)/n,y=(H-P)-(H-P*1.5)*r[f].men/mmx;return x+','+y}).join(' ');
 s+='<polyline points="'+pts+'" fill="none" stroke="#0f172a" stroke-width="2" stroke-dasharray="5 3" opacity="0.75"/>';
 s+='</svg>';
 return '<div class="panel"><h3>'+title+' — daily volumes &amp; manpower</h3>'+s+
 '<div class="legend"><span><span class="sw" style="background:'+C.er+'"></span>Erection M³</span>'+
 '<span><span class="sw" style="background:'+C.mod+'"></span>Modification M³</span>'+
 '<span><span class="sw" style="background:'+C.dis+'"></span>Dismantling M³</span>'+
 '<span><span class="sw" style="background:#0f172a"></span>Day-shift scaffolders (dashed, own scale · peak '+fmt(Math.max.apply(null,days.map(function(r){return r[f].men})))+')</span></div></div>'}

     '<div class="card"><div class="h">'+p[1]+' — dismantling</div><div class="v" style="color:'+C.dis+'">'+fmt(di)+' M³</div><div class="s">'+fmt(di/DATA.days.length,1)+' M³/day avg</div></div>'+

 h+='</div>'+chart('gf','Green Field')+chart('bf','Brown Field');
 h+='<div class="panel"><h3>Productivity by activity (M³ per scaffolder-day — each activity divided by its own scaffolders only)</h3><table><thead><tr><th>Field</th><th class="num">Erection M³</th><th class="num">Erection MD</th><th class="num"><b>Erection M³/MD</b></th><th class="num">Modif. M³</th><th class="num">Modif. MD</th><th class="num">Modif. M³/MD</th><th class="num">Dismantle M³</th><th class="num">Dismantle MD</th><th class="num">Dismantle M³/MD</th><th class="num">Combined M³/MD</th></tr></thead><tbody>';
 [['gf','Green Field'],['bf','Brown Field']].forEach(function(p){var f=p[0];
  var er=sum(f,'er'),di=sum(f,'dis'),mo=sum(f,'mod'),md=mandays(f);

   '<td class="num">'+fmt(mo)+'</td><td class="num">'+fmt(mmo)+'</td><td class="num" style="color:'+C.mod+'">'+(mmo>0?fmt(mo/mmo,2):'–')+'</td>'+

 }else{
  var u=bfSel,o=agg[u]||{er:0,dis:0,mod:0,md:0,act:''},st=status(o);var img=BFIMG[DATA.bfImgMap[u.slice(0,3)]];
  h+='<div style="display:grid;grid-template-columns:1fr 1.4fr;gap:14px">'+
   '<div><div class="laybox" style="border-color:'+st[1]+';border-width:3px">'+(img?'<img src="'+img+'">':'<div class="note">no plot plan</div>')+'</div>'+
   '<div class="cards" style="grid-template-columns:1fr 1fr">'+
    '<div class="card"><div class="h">Erection</div><div class="v" style="color:'+C.er+'">'+fmt(o.er)+' M³</div></div>'+
    '<div class="card"><div class="h">Dismantle</div><div class="v" style="color:'+C.dis+'">'+fmt(o.dis)+' M³</div></div>'+
    '<div class="card"><div class="h">Man-days</div><div class="v">'+fmt(o.md)+'</div></div>'+
    '<div class="card"><div class="h">Status</div><div class="v" style="color:'+st[1]+';font-size:16px">'+st[0]+'</div><div class="s">last work '+(o.lastVol?dlab(o.lastVol):'–')+'</div></div></div></div>'+
   '<div><h3 style="margin:2px 0 8px">Unit '+u+' — daily sheet (since '+dlab(DATA.start)+')</h3><table><thead><tr><th>Date</th><th class="num">Scaffolders</th><th class="num">Er M³</th><th class="num">Mod M³</th><th class="num">Dis M³</th><th>Activity / purpose</th></tr></thead><tbody>';
  DATA.days.slice().reverse().forEach(function(r){var v=(r.bf.units||{})[u];if(!v)return;
   h+='<tr><td>'+dlab(r.d)+'</td><td class="num">'+fmt(v.men)+'</td><td class="num">'+fmt(v.er,1)+'</td><td class="num">'+fmt(v.mod,1)+'</td><td class="num">'+fmt(v.dis,1)+'</td><td class="small muted">'+(v.act||'')+'</td></tr>'});
  h+='</tbody></table></div></div>'+
  '<div class="note"><b>Tag-wise detail:</b> the planners\' daily reports carry unit totals + activity text only — no scaffold tag register has been shared yet. Ask Site Team B / Ahmed to email the BF scaffold tag register (tag no, location, size, erection / dismantle dates); the pipeline already watches for it and this view will gain a tag table automatically.</div></div>';
 }
 $('view').innerHTML=h}
function unitDaily(u){var agg=unitAgg('bf'),o=agg[u];if(!o)return '';
 var st=status(o),tEr=0,tDis=0,tMod=0,tMd=0,tInd=0,rows='';
 DATA.days.forEach(function(r){var v=(r.bf.units||{})[u];if(!v)return;
  var vol=v.er+v.dis+v.mod;if(!(v.men||v.ind||vol))return;
  tEr+=v.er;tDis+=v.dis;tMod+=v.mod;tMd+=v.men;tInd+=(v.ind||0);
  rows+='<tr><td>'+dlab(r.d)+'</td><td class="num">'+fmt(v.men)+'</td><td class="num">'+fmt(v.ind||0)+'</td>'+
   '<td class="num" style="color:'+C.er+'">'+(v.er?fmt(v.er,1):'–')+'</td><td class="num" style="color:'+C.mod+'">'+(v.mod?fmt(v.mod,1):'–')+'</td><td class="num" style="color:'+C.dis+'">'+(v.dis?fmt(v.dis,1):'–')+'</td>'+
   '<td class="num">'+(v.men>0?fmt(vol/v.men,1):'–')+'</td><td class="small muted">'+(v.act||'')+'</td></tr>'});
 var tot=tEr+tDis+tMod;
 return '<div class="panel"><h3>Unit '+u+' — detailed daily analysis <span class="badge" style="background:'+st[1]+';float:none">'+st[0]+'</span></h3>'+
  '<table><thead><tr><th>Date</th><th class="num">Scaffolders</th><th class="num">Indirect</th><th class="num">Erection M³</th><th class="num">Modification M³</th><th class="num">Dismantle M³</th><th class="num">M³/man</th><th>Activity / purpose</th></tr></thead><tbody>'+rows+
  '<tr style="background:#f8fafc;font-weight:700"><td>Total</td><td class="num">'+fmt(tMd)+'</td><td class="num">'+fmt(tInd)+'</td><td class="num" style="color:'+C.er+'">'+fmt(tEr)+'</td><td class="num" style="color:'+C.mod+'">'+fmt(tMod)+'</td><td class="num" style="color:'+C.dis+'">'+fmt(tDis)+'</td><td class="num">'+(tMd>0?fmt(tot/tMd,1):'–')+'</td>'+
  '<td class="small muted">volume mix: erection '+fmt(100*tEr/Math.max(tot,1))+'% · modification '+fmt(100*tMod/Math.max(tot,1))+'% · dismantle '+fmt(100*tDis/Math.max(tot,1))+'%</td></tr></tbody></table></div>'}
function unitTable(f){var agg=unitAgg(f);var h='<div class="panel"><h3>'+(f==='gf'?'Green':'Brown')+' Field — unit detail (since '+dlab(DATA.start)+')</h3><table><thead><tr><th>Unit</th><th>Status</th><th class="num">Erection M³</th><th class="num">Modification M³</th><th class="num">Dismantle M³</th><th class="num">Man-days</th><th class="num">Er M³/erection-MD</th><th class="num">Combined M³/MD</th><th>Last work</th><th>Latest activity</th></tr></thead><tbody>';
 Object.keys(agg).sort().forEach(function(u){var o=agg[u],st=status(o),tot=o.er+o.dis+o.mod;
  h+='<tr><td><b>'+u+'</b></td><td><span style="color:'+st[1]+';font-weight:700;font-size:11px">●&nbsp;'+st[0]+'</span></td><td class="num">'+fmt(o.er)+'</td><td class="num">'+fmt(o.mod)+'</td><td class="num">'+fmt(o.dis)+'</td><td class="num">'+fmt(o.md)+'</td><td class="num" style="color:'+C.er+'"><b>'+(o.mdEr>0?fmt(o.er/o.mdEr,2):'–')+'</b></td><td class="num">'+fmt(tot/Math.max(o.md,1),2)+'</td><td class="small">'+(o.lastVol?dlab(o.lastVol):'–')+'</td><td class="small muted">'+o.act.slice(0,90)+'</td></tr>'});
 return h+'</tbody></table></div>'}
function daily(){var h='<div class="panel"><h3>Daily log (from '+dlab(DATA.start)+')</h3><table><thead><tr><th>Date</th><th>Field</th><th class="num">Scaffolders</th><th class="num">Indirect</th><th class="num">Erection M³</th><th class="num">Modification M³</th><th class="num">Dismantle M³</th><th class="num">M³/man</th><th>Units worked</th></tr></thead><tbody>';
 DATA.days.slice().reverse().forEach(function(r){[['gf','GF'],['bf','BF']].forEach(function(p){var v=r[p[0]];if(!v.men&&!v.er&&!v.dis&&!v.mod)return;
  var us=Object.keys(v.units||{}).filter(function(k){var u=v.units[k];return u.er||u.dis||u.mod}).join(', ');
  h+='<tr><td>'+dlab(r.d)+'</td><td><b>'+p[1]+'</b></td><td class="num">'+fmt(v.men)+'</td><td class="num">'+fmt(v.ind)+'</td><td class="num">'+fmt(v.er,1)+'</td><td class="num">'+fmt(v.mod,1)+'</td><td class="num">'+fmt(v.dis,1)+'</td><td class="num">'+fmt((v.er+v.dis+v.mod)/Math.max(v.men,1),1)+'</td><td class="small muted">'+us+'</td></tr>'})});
 $('view').innerHTML=h+'</tbody></table></div>'}

TABS.forEach(function(t,i){var b=document.createElement('button');b.textContent=t[0];if(i===0)b.className='on';

/* ---- Manual JSON loader: update this dashboard from Scaffolding_Dashboard_data.json ---- */
(function(){
 var KEY='scaf.manual';
 function pd(s){if(!s)return 0;s=String(s);var m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return +new Date(+m[1],+m[2]-1,+m[3]);
  m=s.match(/(\d{1,2})-([A-Za-z]{3})-(\d{4})/);if(m){var M={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};return +new Date(+m[3],M[m[2].toLowerCase()],+m[1]);}return 0;}
 function dOf(o){return pd(o&&(o.asOf||o.dataDate||o.date));}
 function rerender(){var ab=document.querySelector('.tabs button.on');if(ab&&ab.onclick)ab.onclick();else overview();}
 function apply(j){Object.keys(DATA).forEach(function(k){delete DATA[k]});Object.assign(DATA,j);rerender();}
 try{var s=localStorage.getItem(KEY);
  if(s){var j0=JSON.parse(s);if(dOf(j0)>=dOf(DATA))apply(j0);else localStorage.removeItem(KEY);}}catch(e){}
 var b=document.createElement('button');b.textContent='⇪ Load JSON';
 b.title='Manual update: pick Scaffolding_Dashboard_data.json (or an edited copy). Stays until the automation produces newer data.';
 b.style.cssText='position:fixed;bottom:12px;right:12px;z-index:9999;background:#0f172a;color:#fff;border:0;border-radius:8px;padding:8px 12px;font:600 12px system-ui;cursor:pointer;box-shadow:0 2px 8px rgba(15,23,42,.25);opacity:.85';
 var i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.style.display='none';
 b.onclick=function(){i.click()};
 i.onchange=function(){var f=i.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var j=JSON.parse(r.result);
    if(!j||typeof j!=='object'||!j.days){alert('This does not look like the scaffolding JSON (missing "days").');return;}
    apply(j);try{localStorage.setItem(KEY,r.result)}catch(e2){}
    b.textContent='✓ loaded';setTimeout(function(){b.textContent='⇪ Load JSON'},2500);
   }catch(e){alert('Invalid JSON: '+e.message)}};
  r.readAsText(f);i.value='';};
 document.body.appendChild(b);document.body.appendChild(i);
})();
</script></body></html>
